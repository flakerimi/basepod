id: postgres
name: PostgreSQL
version: "16"
description: Object-relational database. The world's most advanced open source RDBMS.
icon: postgres
fields:
  - key: POSTGRES_PASSWORD
    label: Password
    type: password
    required: true
  - key: POSTGRES_DB
    label: Default database
    default: app
  - key: POSTGRES_USER
    label: Superuser
    default: postgres
deploy:
  image: docker.io/library/postgres:16
  env:
    POSTGRES_PASSWORD: "{{.POSTGRES_PASSWORD}}"
    POSTGRES_DB: "{{.POSTGRES_DB}}"
    POSTGRES_USER: "{{.POSTGRES_USER}}"
  volumes:
    - container: /var/lib/postgresql/data
      host: "~/BasePodData/{{.app_name}}/pgdata"
  ports:
    - 5432
  internal_only: true
  healthcheck:
    cmd: ["pg_isready", "-U", "{{.POSTGRES_USER}}"]
